<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Юки — видеосвязь</title>
<link rel="stylesheet" href="./css/yuki.css">
<link rel="stylesheet" href="./css/call.css">
<script src="./vendor/qwebchannel.js"></script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
  <div class="call" id="call">
    <canvas class="gl" aria-hidden="true"></canvas>
    <div class="call__vignette" aria-hidden="true"></div>

    <header class="call__top" id="drag">
      <div class="brand">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44"/><path d="M31 30 L50 52 L69 30 M50 52 L50 76"/></svg>
        <div>
          <b>YUKI</b>
          <span class="mono">видеосвязь</span>
        </div>
      </div>
      <span class="pill live"><i></i><span class="mono" id="timer">00:00</span></span>
      <span class="pill" id="state-pill"><i></i><span id="state-text">соединяю</span></span>
      <div class="call__stats">
        <span class="pill" id="vision-pill"><i></i><span id="vision-text">экран…</span></span>
        <span class="pill" id="camera-pill"><i></i><span id="camera-text">камера…</span></span>
      </div>
    </header>

    <aside class="side">
      <article class="feed">
        <div class="feed__head"><span class="mono">ЭКРАН</span><span class="mono dim" id="screen-meta">—</span></div>
        <div class="feed__frame">
          <img id="screen" alt="Живой кадр экрана, который видит Юки">
          <div class="feed__scan" aria-hidden="true"></div>
          <div class="feed__empty mono" id="screen-empty">подключаю захват экрана…</div>
        </div>
        <p class="feed__caption" id="caption" aria-live="polite">Юки смотрит на экран и опишет, что видит.</p>
      </article>
      <article class="feed feed--cam">
        <div class="feed__head"><span class="mono">КАМЕРА</span><span class="mono dim" id="face">—</span></div>
        <div class="feed__frame feed__frame--cam">
          <img id="camera" alt="Кадр веб-камеры">
          <div class="feed__empty mono" id="camera-empty">камера включается…</div>
          <div class="gesture mono" id="gesture" hidden></div>
        </div>
      </article>
      <article class="transcript">
        <div class="feed__head"><span class="mono">РАЗГОВОР</span></div>
        <ol id="lines"></ol>
      </article>
    </aside>

    <div class="subs" aria-live="polite">
      <p class="subs__you" id="you"></p>
      <p class="subs__yuki" id="yuki"></p>
    </div>

    <nav class="dock" aria-label="Управление звонком">
      <button class="dock__btn is-on" id="mic" type="button" title="Микрофон" aria-pressed="true">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
        <span>микрофон</span>
      </button>
      <button class="dock__btn" id="stop" type="button" title="Замолчать">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span>тише</span>
      </button>
      <button class="dock__btn" id="look" type="button" title="Что на экране?">
        <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>что видишь</span>
      </button>
      <button class="dock__btn" id="mini" type="button" title="В угол (Esc / Ctrl+M)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><rect x="12" y="12" width="7" height="6" rx="1.5"/></svg>
        <span>в угол</span>
      </button>
      <button class="dock__btn dock__btn--end" id="hangup" type="button" title="Завершить звонок">
        <svg viewBox="0 0 24 24"><path d="M3 14c5-5 13-5 18 0l-2.5 2.5-3.5-1.5v-3c-2-.7-4-.7-6 0v3l-3.5 1.5z"/></svg>
        <span>завершить</span>
      </button>
    </nav>
  </div>
  <script type="module" src="./js/call.js"></script>
</body>
</html>
